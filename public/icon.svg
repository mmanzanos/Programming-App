<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner ambient glow -->
  <circle cx="256" cy="180" r="140" fill="#ffffff" opacity="0.12" />

  <!-- Code brackets and slash: < / > -->
  <g filter="url(#glow)">
    <!-- Left bracket < -->
    <path d="M190 170 L110 256 L190 342" fill="none" stroke="url(#codeGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Slash / -->
    <path d="M280 150 L232 362" fill="none" stroke="#34d399" stroke-width="36" stroke-linecap="round" />
    <!-- Right bracket > -->
    <path d="M322 170 L402 256 L322 342" fill="none" stroke="url(#codeGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Marc badge spark -->
  <circle cx="396" cy="160" r="18" fill="#fbbf24" />
</svg>
